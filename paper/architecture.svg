   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b3a" x="36.072" y="30.401681" transform="rotate(-0 36.072 30.401681)">StemgenRT-5.8  |  Real-time low-latency music source separation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #647686" x="36.072" y="48.551375" transform="rotate(-0 36.072 48.551375)">Historical four-state C204 architecture · stereo 44.1 kHz · 128 new samples per call</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182b3a" x="91.944" y="153.574712" transform="rotate(-0 91.944 153.574712)">Input + history</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(52.488141 177.165598)">128 new samples</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(47.552906 188.953277)">896 stored samples</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182b3a" x="270.036" y="84.493775" transform="rotate(-0 270.036 84.493775)">Spectral encoder</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(198.6435 102.861598)">Asymmetric window + FFT1024</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(200.958891 114.649277)">Real/imaginary → 500 features</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182b3a" x="270.036" y="226.189775" transform="rotate(-0 270.036 226.189775)">Waveform encoder</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(199.522406 244.557598)">Gated Conv1024 → 1500 bases</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(212.547094 256.345277)">Projection → 500 features</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182b3a" x="483.048" y="146.701775" transform="rotate(-0 483.048 146.701775)">Shared recurrent fusion</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(437.854641 171.271758)">Concatenate → GRU</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(430.170187 183.059437)">2 layers × 1000 hidden</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(445.603078 194.847117)">Residuals → split</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182b3a" x="713.52" y="84.454712" transform="rotate(-0 713.52 84.454712)">Spectral synthesis</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(654.943359 102.861598)">Source masks → IFFT1024</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(638.906484 114.649277)">Tail 256 + window + overlap-add</text>
   </g>
